name: 自動更新 dateModified

on:
  push:
    branches: [main]
    paths:
      - '**.html'
      - 'tools/update-datemodified.js'
      - '.github/workflows/datemodified.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: datemodified-${{ github.ref }}
  cancel-in-progress: true

jobs:
  datemodified:
    runs-on: ubuntu-latest
    steps:
      - name: 取得原始碼
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 更新 JSON-LD dateModified
        run: node tools/update-datemodified.js

      - name: 有變化就提交（帶重試對抗 race condition）
        run: |
          if git diff --quiet -- '*.html' 'blog/*.html'; then
            echo "無 dateModified 變化，唔使提交"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '*.html' 'blog/*.html' || true
          # [skip ci] 防止 workflow 自己 push 觸發循環
          git commit -m "自動更新 dateModified（跟隨 git commit 日期）[skip ci]"
          # 重試最多 5 次應對 race condition
          for i in 1 2 3 4 5; do
            if git push; then
              echo "第 $i 次推送成功"
              exit 0
            fi
            echo "第 $i 次推送失敗，pull rebase 後重試..."
            git pull --rebase --autostash
            sleep $((RANDOM % 3 + 1))
          done
          echo "推送失敗超過 5 次"
          exit 1
