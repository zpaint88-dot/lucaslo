name: 自動更新 dateModified

on:
  push:
    branches: [main]
    paths:
      - '**.html'
      - 'tools/update-datemodified.js'
      - '.github/workflows/datemodified.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: datemodified-${{ github.ref }}
  cancel-in-progress: true

jobs:
  datemodified:
    runs-on: ubuntu-latest
    steps:
      - name: 取得原始碼
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # 用 PAT 或者 default token — 因為要 commit push 返
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 更新 JSON-LD dateModified
        run: node tools/update-datemodified.js

      - name: 有變化就提交
        run: |
          if git diff --quiet -- '*.html' 'blog/*.html'; then
            echo "無 dateModified 變化，唔使提交"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # 只 add 有改動嘅 HTML
          git add '*.html' 'blog/*.html' || true
          # [skip ci] 防止 workflow 自己 push 觸發循環（sitemap.yml 亦不會被 trigger 因為 sitemap.xml 未改）
          git commit -m "自動更新 dateModified（跟隨 git commit 日期）[skip ci]"
          git push
